[pytest]
# Pytest configuration for Rentyl backend tests.
# Run from the repo root (`pytest backend`) or from backend/ (`pytest`).

# Test discovery patterns (tests are colocated, e.g. services/tests/*_test.py)
python_files = *_test.py test_*.py
python_classes = Test*
python_functions = test_*

minversion = 7.0

# pytest-asyncio: one event loop per test (the plugin default, made explicit)
asyncio_default_fixture_loop_scope = function

# Repo root on sys.path so `import backend...` works
pythonpath = ..

addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
