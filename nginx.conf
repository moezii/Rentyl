server {
    listen 10000;
    server_name localhost;

    # The backend accepts uploads up to 5 MB (nginx's default limit is 1 MB)
    client_max_body_size 6m;
    root /var/www/html;
    index index.html;

    # Security headers (modern, hardened configuration)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy - Allow AMWAL payment gateway and Google Pay
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.amwalpg.com https://test.amwalpg.com https://pay.google.com https://www.gstatic.com https://maps.googleapis.com https://*.online-metrix.net https://applepay.cdn-apple.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://checkout.amwalpg.com https://test.amwalpg.com https://*.online-metrix.net https://www.google-analytics.com; frame-src 'self' https://checkout.amwalpg.com https://test.amwalpg.com https://pay.google.com https://applepay.cdn-apple.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

    # API routes - proxy to backend (strip /api prefix and forward to root)
    location /api/ {
        # Remove /api prefix and forward to backend
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://localhost:8000/;
        
        # Essential headers for proper proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Essential for cookie forwarding
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_headers on;
        
        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Device-Fingerprint,X-Request-ID,X-Request-Time' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Type' 'text/plain; charset=utf-8' always;
            add_header 'Content-Length' 0 always;
            return 204;
        }
        
        # Add CORS headers for all API responses (fixed for cookie support)
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Device-Fingerprint,X-Request-ID,X-Request-Time' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        
        # Error handling for backend
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
        
        # Timeout settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Handle backend down
    location @backend_down {
        return 503 '{"error": "Service temporarily unavailable", "message": "Backend service is starting up. Please try again in a moment."}';
        add_header Content-Type application/json;
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Device-Fingerprint,X-Request-ID,X-Request-Time' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # Handle client-side routing for React
    location / {
        try_files $uri $uri/ /index.html;
        
        # Add CORS headers for static files
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
} 